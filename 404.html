<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>404 — Page Not Found</title>

  <style>
    :root {
      --bg: #0e0f13;
      --card: #151823;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --danger: #ef4444;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #14182a, var(--bg));
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      overflow: hidden;
    }

    .container {
      max-width: 520px;
      width: 100%;
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 3rem 2rem;
      text-align: center;
      position: relative;
      animation: fadeUp 0.9s ease forwards;
    }

    .glow {
      position: absolute;
      inset: -1px;
      border-radius: 18px;
      background: linear-gradient(120deg, transparent, rgba(59,130,246,0.25), transparent);
      opacity: 0.4;
      filter: blur(18px);
      pointer-events: none;
    }

    .code {
      font-size: clamp(4.5rem, 12vw, 6.5rem);
      font-weight: 800;
      letter-spacing: 0.05em;
      background: linear-gradient(180deg, #fff, #9ca3af);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
      animation: float 4s ease-in-out infinite;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 0.75rem;
    }

    p {
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .btn {
      padding: 0.85rem 1.25rem;
      border-radius: 10px;
      border: none;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-hover));
      color: white;
      box-shadow: 0 10px 25px rgba(59,130,246,0.35);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(59,130,246,0.5);
    }

    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.15);
    }

    .btn-secondary:hover {
      background: rgba(255,255,255,0.05);
      transform: translateY(-2px);
    }

    .icon {
      font-size: 1.2rem;
      opacity: 0.85;
    }

    .footer-note {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: #6b7280;
    }

    /* Animations */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    /* Responsive */
    @media (min-width: 640px) {
      .actions {
        flex-direction: row;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="glow"></div>

    <div class="code">404</div>

    <h1>Yeah… this one’s on me.</h1>

    <p>
      Looks like you’ve landed on a page that doesn’t exist.
      The link might be broken, or I may have moved things around.
      Either way, you’re still in the right place.
    </p>

    <div class="actions">
      <a href="/" class="btn btn-primary">
        <span class="icon">🏠</span>
        Go Back Home
      </a>

      <a href="https://www.youtube.com/channel/UCBl9Mgs6CmQaQGYjDLYhv9g" class="btn btn-secondary" target="_blank" rel="noopener">
        <span class="icon">▶</span>
        Visit My YouTube
      </a>
    </div>

    <div class="footer-note">
      Lost pages happen. Clean design doesn’t.
    </div>
  </main>

  <script>
    // Subtle interaction polish
    document.querySelectorAll('.btn').forEach(btn => {
      btn.addEventListener('mouseenter', () => {
        btn.style.transform = 'translateY(-2px)';
      });
      btn.addEventListener('mouseleave', () => {
        btn.style.transform = 'translateY(0)';
      });
    });
  </script>
</body>
</html>
